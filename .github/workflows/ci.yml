name: AsmWeb CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-engineering-regression:
    name: M0 engineering regression (not formal qualification)
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    timeout-minutes: 20
    steps:
      - name: Install build and test dependencies
        run: dnf install -y git make nasm binutils python3 findutils coreutils openssh-clients
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          nasm -v
          ld --version | head -n 1
          make --version | head -n 1
          python3 --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Build production executable
        run: make all
      - name: Verify full-schema Invariant Register
        run: python3 -B qualification/tools/m0_normative_ir.py verify
      - name: Verify M0 full-schema Limit Register
        run: python3 -B qualification/tools/m0_normative_lr.py verify
      - name: Verify canonical M0 production limits
        run: python3 -B qualification/tools/m0_limit_register.py verify
      - name: Verify effective production configuration
        run: python3 -B qualification/tools/m0_effective_configuration.py verify
      - name: Verify M0 engineering baseline
        shell: bash
        run: |
          set -euo pipefail
          make qualify-production-registry
          make qualify-production-limit-manifest
          make qualify-m0-lr-evidence
          make qualify-m0-governance-trace
          make qualify-mot-ceiling-integration
          make qualify-memory-ceiling
          make qualify-runtime-invariant
      - name: Verify first HTTP response
        run: |
          python3 tests/integration/first_http.py
          python3 tests/integration/socket_failures.py
          python3 tests/integration/http_idle_survival.py
          make qualify-http-descriptor-lifecycle
          make qualify-http-descriptor-mutations
          make qualify-udp-loopback
          make qualify-tcp-accept4
          make qualify-network-error-paths
          make qualify-stream-fragments
          make qualify-stream-short-write
          make qualify-network-eintr
          make qualify-udp-batch-transfer
          make qualify-udp-batch-bounds
          make qualify-udp-checked-descriptors
          make qualify-udp-checked-transfer
          make qualify-udp-checked-mutations
          make qualify-udp-batch-mutations
          make qualify-deadline
          make qualify-checkpoint-reconciliation
          make qualify-checkpoint-reconciliation-adversarial
          make qualify-diagnostic
          make qualify-diagnostic-adversarial
          make qualify-diagnostic-boundary
          make qualify-ready-diagnostic
          make qualify-ready-bootstrap-injection
          make qualify-ready-diagnostic-matrix
      - name: Verify ownership proposal journal
        run: |
          python3 -B qualification/tools/ownership_snapshot.py
          python3 -B tests/qualification/ownership_proposal_journal.py
      - name: Verify signed ownership authority
        run: python3 -B tests/qualification/ownership_authority.py
      - name: Verify signed ownership decisions
        run: python3 -B tests/qualification/ownership_signed_decision.py
      - name: Verify ownership generation publication
        run: python3 -B tests/qualification/ownership_generation.py
      - name: Verify integrated ownership transactions
        run: python3 -B tests/qualification/ownership_transaction.py
      - name: Verify clean incremental build
        run: make all
